<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA - Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>NOVA</h1>
        <p>Save. Earn. Grow.</p>
    </header>

    <main>
        <div class="welcome-card">
            <h2>Create Your Account</h2>
            <p>Start your financial journey today.</p>
            
            <!-- This tells the computer to open the dashboard when the button is clicked -->
            <form action="dashboard.html">
                <input type="text" placeholder="Full Name" required style="width: 90%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">
                <input type="email" placeholder="Email Address" required style="width: 90%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">
                <input type="password" placeholder="Create Password" required style="width: 90%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">
                
                <button type="submit">Join NOVA</button>
            </form>

            <p><a href="index.html" style="color: #001f3f; text-decoration: none;">Go back to Home</a></p>
        </div>
    </main>
</body>
</html>
